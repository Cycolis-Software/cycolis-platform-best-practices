# =============================================================================
# CI Workflow
# =============================================================================
# Self-contained on purpose: this repository is PUBLIC and
# cycolis-platform-devops is PRIVATE. GitHub never lets a public repository
# call reusable workflows or actions from a private one, so the checks below
# mirror the devops ci-github.yml gate (format-files.sh --check, lint-check.sh,
# security-scan.sh, version-check.sh) using public tooling only.
#
# Security: pull_request (never pull_request_target), read-only token, no
# secrets. Fork PRs run with the same restricted permissions.
# =============================================================================

name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Format: trailing whitespace, CRLF, final newline, BOM, conflict markers
  # ===========================================================================
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check formatting
        shell: bash
        run: |
          set -uo pipefail
          errors=0
          while IFS= read -r -d '' f; do
            [[ -f "$f" ]] && grep -Iq . "$f" || continue
            issues=()
            grep -q $'\r' "$f" && issues+=("crlf")
            grep -q '[[:blank:]]$' "$f" && issues+=("trailing-whitespace")
            [[ -s "$f" && "$(tail -c 1 "$f" | wc -l)" -eq 0 ]] && issues+=("missing-final-newline")
            head -c 3 "$f" | grep -q $'\xef\xbb\xbf' && issues+=("bom")
            grep -qE '^(<{7}( |$)|={7}$|>{7}( |$))' "$f" && issues+=("merge-conflict-markers")
            if [[ ${#issues[@]} -gt 0 ]]; then
              echo "::error file=$f::${issues[*]}"
              errors=$((errors + 1))
            fi
          done < <(git ls-files -z)
          if [[ $errors -gt 0 ]]; then
            echo "$errors file(s) need formatting (run cycolis-platform-devops/scripts/format-files.sh)"
            exit 1
          fi
          echo "All tracked text files are properly formatted"

  # ===========================================================================
  # Lint: yamllint (blocking), markdownlint (non-blocking, as in devops)
  # ===========================================================================
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: YAML lint
        shell: bash
        run: |
          set -euo pipefail
          pip install --quiet --user yamllint==1.35.1
          cat > "$RUNNER_TEMP/yamllint.yml" <<'EOF'
          extends: default
          rules:
            line-length:
              max: 120
              level: error
            trailing-spaces: {}
            indentation:
              spaces: 2
              indent-sequences: true
            truthy: disable
            document-start: disable
            document-end: disable
            comments:
              min-spaces-from-content: 1
          EOF
          mapfile -t files < <(git ls-files '*.yml' '*.yaml')
          if [[ ${#files[@]} -eq 0 ]]; then echo "No YAML files"; exit 0; fi
          yamllint -c "$RUNNER_TEMP/yamllint.yml" "${files[@]}"

      - name: Markdown lint (non-blocking)
        shell: bash
        run: |
          if ! npx --yes markdownlint-cli@0.41.0 '**/*.md' --ignore node_modules; then
            echo "::warning::Markdown lint issues found (non-blocking)"
          fi

  # ===========================================================================
  # Security: secret scan with gitleaks (checksum-verified binary)
  # ===========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.18.4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan for secrets
        shell: bash
        run: gitleaks detect --source . --no-banner --redact --verbose

  # ===========================================================================
  # Version: VERSION must exist, be semver, and be bumped above main
  # ===========================================================================
  version-check:
    name: Check Version
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check VERSION bump
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          [[ -f VERSION ]] || { echo "::error file=VERSION::VERSION file is missing"; exit 1; }
          new=$(tr -d '[:space:]' < VERSION)
          [[ "$new" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error file=VERSION::'$new' is not X.Y.Z"; exit 1; }
          old=$(git show "origin/${BASE_REF}:VERSION" 2>/dev/null | tr -d '[:space:]' || true)
          if [[ -z "$old" ]]; then
            echo "No VERSION on ${BASE_REF} yet — $new will be the first release"
            exit 0
          fi
          if [[ "$new" == "$old" || "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n1)" != "$new" ]]; then
            echo "::error file=VERSION::VERSION must be bumped above ${old} (found ${new})"
            exit 1
          fi
          echo "VERSION bumped: ${old} -> ${new}"
